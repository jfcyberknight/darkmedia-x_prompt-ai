user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Chemins temporaires SOUS /tmp : le dossier par défaut
    # (/var/lib/nginx/tmp) appartient à l'utilisateur `nginx` en mode 700 et
    # n'est pas traversable par les workers qui tournent en `www-data` — dès
    # qu'une réponse dépassait les buffers mémoire (ex. GET /api/prompts,
    # ~157 Ko), nginx ne pouvait pas écrire/lire son fichier temporaire
    # (open() EACCES) et coupait la connexion en plein corps de réponse →
    # « net::ERR_HTTP2_PROTOCOL_ERROR » côté navigateur. Sous /tmp (1777),
    # le master crée et chowne les sous-dossiers à l'utilisateur des workers.
    client_body_temp_path /tmp/nginx-tmp/client_body;
    fastcgi_temp_path    /tmp/nginx-tmp/fastcgi;
    proxy_temp_path      /tmp/nginx-tmp/proxy;
    scgi_temp_path       /tmp/nginx-tmp/scgi;
    uwsgi_temp_path      /tmp/nginx-tmp/uwsgi;

    gzip on;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Le conteneur est destiné à tourner derrière le reverse-proxy du VPS,
        # qui termine le TLS et transmet X-Forwarded-*. HSTS est géré en amont
        # (Cloudflare / reverse-proxy) car le conteneur ne voit que du HTTP.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # CSP : modules locaux uniquement + Google Fonts ; les styles inline sont
        # nécessaires au rendu (attributs style générés par le front). Le jeton de
        # magic link vit dans l'URL : strict-origin-when-cross-origin (ci-dessus)
        # empêche sa fuite vers les hôtes tiers.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
            # Buffers plus généreux : le catalogue complet (~157 Ko) tient en
            # mémoire, sans recours au fichier temporaire (et donc sans risque
            # de coupure de connexion si /tmp n'était pas accessible).
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_busy_buffers_size 32k;
        }

        location ~* \.(?:css|js|svg|ico|png|jpg|jpeg|gif|woff2?)$ {
            # `expires` pose Cache-Control/Expires sans add_header : les headers
            # de sécurité du server (ci-dessus) restent hérités ici.
            expires 7d;
            try_files $uri =404;
        }

        # Le service worker ne doit jamais être mis en cache agressivement,
        # sinon les mises à jour de la PWA ne sont jamais détectées.
        location = /sw.js {
            expires -1;
            try_files $uri =404;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
